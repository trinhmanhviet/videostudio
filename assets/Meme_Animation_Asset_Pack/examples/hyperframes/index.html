<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<style>
html,body{margin:0;background:#f4efe7;overflow:hidden;font-family:Arial,sans-serif}
#root{position:relative;overflow:hidden;background:#f4efe7}
.actor{position:absolute;transform-origin:50% 85%;will-change:transform,opacity}
.actor img{width:100%;height:100%;object-fit:contain;display:block}
#panda{left:90px;bottom:250px;width:330px;height:330px}
#banana{right:90px;bottom:220px;width:350px;height:500px}
#caption{position:absolute;left:80px;right:80px;bottom:90px;text-align:center;font-size:54px;font-weight:800;color:#111}
</style>
</head>
<body>
<div id="root" data-composition-id="meme-demo" data-start="0" data-width="1080" data-height="1920">
  <div id="panda" class="clip actor" data-start="0" data-duration="6" data-track-index="0">
    <img src="../../Panda/auto_sliced/actions_props/component_001.png" alt="panda" />
  </div>
  <div id="banana" class="clip actor" data-start="0" data-duration="6" data-track-index="1">
    <img src="../../BananaCat/auto_sliced/expressions_actions/component_001.png" alt="banana cat" />
  </div>
  <div id="caption" class="clip" data-start="0" data-duration="6" data-track-index="2">Khi sếp bảo: “Việc này 5 phút thôi.”</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    // HyperFrames official pattern: paused GSAP timeline registered on window.__timelines.
    const tl = gsap.timeline({paused:true});
    tl.from('#panda',{opacity:0,x:-80,duration:.35},0)
      .to('#panda',{rotation:-4,duration:.12,yoyo:true,repeat:5},1.0)
      .from('#banana',{opacity:0,scale:.7,duration:.25},1.4)
      .to('#banana',{x:-170,rotation:-8,duration:.35,ease:'power2.out'},2.0)
      .to('#banana',{x:700,rotation:10,duration:.75,ease:'power2.in'},3.0)
      .to('#panda',{scale:1.15,duration:.15,yoyo:true,repeat:1},3.1);
    window.__timelines = window.__timelines || {};
    window.__timelines['meme-demo'] = tl;
  </script>
</div>
</body>
</html>
