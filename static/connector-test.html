<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm tra connector VideoStudio</title><style>body{font:17px/1.6 system-ui;background:#121a16;color:#edf6ec;max-width:700px;margin:60px auto;padding:24px}button{font:inherit;padding:14px 22px;border:0;border-radius:8px;background:#c3ed91;cursor:pointer}#status{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#c3ed91}</style><h1>Kiểm tra kết nối ChatGPT</h1><p>Đây là trang kiểm tra kỹ thuật riêng, không phải bước duyệt trong quá trình tạo video.</p><p>Bấm một lần để cho phép connector StoryForge hiện có gửi một câu hỏi ngắn, chỉ yêu cầu trả JSON kiểm tra. Không tạo ảnh, giọng hay video.</p><section id="panel"><button id="start" type="button" data-chatgpt-web-action="start">Kiểm tra kết nối một lần</button><p id="status">Đang chờ connector...</p><p id="result"></p></section><script>
const scope=location.pathname.split('/')[3],panel=document.querySelector('#panel');panel.dataset.chatgptWebProject=scope;panel.dataset.chatgptWebRun=scope;panel.dataset.chatgptWebScopeKind='run';panel.dataset.chatgptWebBase=`projects/${scope}/runs/${scope}/chatgpt-exchanges`;
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));return d}
window.addEventListener('message',event=>{if(event.source!==window||event.origin!==location.origin||event.data?.source!=='storyforge-chatgpt-web'||event.data.run_id!==scope)return;const s=event.data.status??{};document.querySelector('#status').textContent=s.error?.message??`Connector ${s.build??''}: ${s.stage??''}`;api('/api/connector/status/'+scope,{method:'POST',body:JSON.stringify({build:s.build??'',stage:s.stage??'',connected:!!s.connected,enabled:!!s.enabled,error:s.error,logs:s.logs})}).catch(()=>{});});
let busy=false;document.querySelector('#start').onclick=async event=>{if(!event.isTrusted||busy)return;busy=true;document.querySelector('#start').disabled=true;try{const d=await api('/api/connector/smoke/'+scope,{method:'POST'});const receipt=`/api/v1/projects/${scope}/runs/${scope}/chatgpt-exchanges/${d.exchange_id}`;document.querySelector('#result').textContent='Đã tạo yêu cầu kiểm tra. Đang chờ phản hồi có receipt.';let count=0;const timer=setInterval(async()=>{try{const r=await api(receipt);if(r.accepted){clearInterval(timer);document.querySelector('#result').textContent='Server đã nhận phản hồi đúng exchange. Đây chưa phải nghiệm thu tạo video.';}else if(++count>=90){clearInterval(timer);document.querySelector('#result').textContent='Chưa nhận được phản hồi sau ngân sách chờ. Yêu cầu được giữ lại, không tự tạo yêu cầu thứ hai.';}}catch(e){clearInterval(timer);document.querySelector('#result').textContent=e.message;}},2000);}catch(e){document.querySelector('#result').textContent=e.message;}};
</script></html>
