<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoStudio - Local AI Video Workspace</title><style>
html{background:#101827}
:root{color-scheme:dark;--bg:#101827;--card:#1b293c;--line:#35445b;--text:#f3f6fa;--muted:#a8b7c9;--accent:#79c9ef;--bad:#ffaaa5;--warn:#ecd18c;--blue:#79c9ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:1200px;margin:auto;padding:clamp(16px,3vw,36px)}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px;flex-wrap:wrap;gap:12px}
h1{font-size:26px;letter-spacing:-1px;margin:0;display:flex;align-items:center;gap:8px}
small,.muted{color:var(--muted);font-size:13px}
.nav-tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px;overflow-x:auto}
.tab-btn{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font:600 14px system-ui;cursor:pointer;white-space:nowrap}
.tab-btn.active{background:var(--accent);color:#0f1a28;border-color:var(--accent)}
.card{padding:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:20px;margin-top:16px}
.project-toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.project-toolbar label{margin:8px 0 4px}
.project-search{flex:1 1 220px;min-width:0}
.project-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.project-actions button{padding:7px 10px}
.project-delete-choice{display:flex;gap:8px;align-items:start;font-weight:400;cursor:pointer}
.project-delete-choice input{width:auto;flex:none;margin-top:5px}
#projectDeleteDescription{overflow-wrap:anywhere}
.project-pagination{margin-top:16px;justify-content:space-between}
.project-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;display:flex;flex-direction:column}
.project-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.project-thumb{width:100%;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:32px;overflow:hidden}
.project-thumb img{width:100%;height:100%;object-fit:cover}
.project-info{padding:16px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.project-title{font-size:17px;font-weight:700;margin:0 0 6px;overflow-wrap:anywhere}
.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
label{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}
textarea,select,input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);font:inherit}
textarea{resize:vertical;min-height:120px}
input[type=range]{padding:0;height:6px;cursor:pointer;accent-color:var(--accent)}
button,.button{background:var(--accent);color:#0f1a28;border:0;border-radius:8px;padding:9px 16px;font:600 14px system-ui;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
button.secondary:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.duration{display:grid;grid-template-columns:1fr 110px;gap:10px}
.error{color:var(--bad);white-space:pre-wrap;overflow-wrap:anywhere}
.check{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.check:last-child{border:0}
.pass{color:var(--accent)}
.job{border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;background:var(--card)}
.job h3{margin:0 0 6px;font-size:16px;overflow-wrap:anywhere}
.badge{border:1px solid var(--line);padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.badge.status-completed,.badge.status-succeeded{background:rgba(121,201,239,0.15);color:var(--accent);border-color:var(--accent)}
.badge.status-running{background:rgba(125,211,252,0.15);color:var(--blue);border-color:var(--blue)}
.badge.status-failed{background:rgba(255,142,133,0.15);color:var(--bad);border-color:var(--bad)}
.badge.status-queued{background:rgba(252,211,77,0.15);color:var(--warn);border-color:var(--warn)}
progress{width:100%;accent-color:var(--accent);margin:10px 0;height:8px}
video{width:100%;max-height:500px;background:#000;border-radius:8px;margin:12px 0}
audio{width:100%;height:36px;margin-top:8px}
.notice{padding:8px 0;color:var(--muted);font-size:13px}
.fix-suggestion{margin:12px 0;padding:14px;background:rgba(252,211,77,0.08);border:1px solid rgba(252,211,77,0.3);border-radius:10px}
.fix-suggestion h4{margin:0 0 6px;color:var(--warn);font-size:14px}
.fix-suggestion p{margin:4px 0;font-size:13px}
.subtask-indicator{color:var(--blue);font-weight:600;font-size:13px;margin:6px 0}
.completed-hero{margin-top:20px;border:2px solid var(--accent);border-radius:12px;padding:18px;background:#0c130f}
.terminal{background:#090d0b;border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.4 Consolas,monospace;color:#a3e635;min-height:120px;height:320px;max-height:800px;overflow-y:auto;white-space:pre-wrap;resize:vertical}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:440px;width:100%;box-shadow:0 12px 36px rgba(0,0,0,0.6)}
[hidden]{display:none!important}
@media(max-width:760px){
  .layout{grid-template-columns:1fr}
  .terminal{height:180px;max-height:350px}
}
</style><link rel="stylesheet" href="/studio-shell.css?v=20261110-1"><link rel="stylesheet" href="/studio-create.css?v=20261115-social2"><link rel="stylesheet" href="/studio-details.css?v=20261113-d476d677bf9a"><link rel="stylesheet" href="/studio-unified.css?v=20261116-services1"><link rel="stylesheet" href="/story-workspace.css?v=20261116-tabs1"></head><body class="studio-ready"><main><header class="studio-topbar"><div><small>LOCAL VIDEO WORKSPACE</small><h1>🎬 VideoStudio</h1></div><div class="row"><button type="button" class="secondary" id="openLogBtn">🖥️ Live Console</button><button type="button" class="secondary" id="globalRefresh">Làm mới</button></div></header><aside class="card" id="studioConnection" hidden><div class="row" style="justify-content:space-between"><h2>Điều kiện chạy</h2><button class="secondary" id="refresh" type="button">Kiểm tra lại</button></div><div class="row" style="margin-bottom:10px"><button class="secondary" id="browserStart" type="button">Mở Chrome riêng</button><button class="secondary" id="browserProbe" type="button">Kiểm tra kết nối</button></div><div id="checks" aria-live="polite">Đang kiểm tra kết nối...</div><p id="connectorStatus" class="notice">Đang kiểm tra connector Chrome.</p><p class="notice">Video chỉ được báo hoàn tất sau khi kiểm tra đầu ra an toàn.</p></aside></main>
<script>
'use strict';
// The studio (content-studio.js) owns every page. This classic script keeps only what it shares with them:
// the "Kết nối tạo video" card in Cài đặt (preflight, dedicated Chrome), the social caption panel used by Kho video,
// and opening the optional editor/workflow tab.
const $=s=>document.querySelector(s);
function text(tag,value,cls){const n=document.createElement(tag);n.textContent=value??'';if(cls)n.className=cls;return n}
function safeURL(value){try{const u=new URL(value,location.href);return u.origin===location.origin?u.href:null}catch{return null}}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...options.headers},signal:AbortSignal.timeout(path.startsWith('/api/browser/')?45000:60000)});const d=await r.json().catch(()=>({detail:'Phản hồi server không hợp lệ'}));if(!r.ok){let m=d.detail??d.error??d.message??`HTTP ${r.status}`;throw Error(typeof m==='string'?m:JSON.stringify(m))}return d}

let extensionScope=location.pathname.match(/^\/story-video\/projects\/([0-9a-f-]{36})\/production$/i)?.[1]||null;
let usesExtension=!!extensionScope;
function selectStudioConnectorScope(scope){if(extensionScope||!(/^[0-9a-f-]{36}$/i).test(scope||''))return;extensionScope=scope;configureTextTransport('extension');preflight();}
function configureTextTransport(transport){
  if(!extensionScope&&transport!=='extension')return;
  usesExtension=true;$('#browserStart').hidden=true;$('#browserProbe').hidden=true;
  $('#connectorStatus').textContent=extensionScope?'Đã chọn extension bridge cho tác vụ video; trạng thái kết nối ở bảng nổi.':'Bấm Start trong bảng extension để kết nối công cụ tạo video, rồi Test chữ nếu chưa kiểm tra phiên này.';
}
configureTextTransport();
function preflightRequestPath(){return '/api/preflight'+(extensionScope?'?scope='+encodeURIComponent(extensionScope):'');}
async function preflight(){const path=preflightRequestPath();try{const d=await api(path);if(path!==preflightRequestPath())return;configureTextTransport(d.text_transport);const ready=d.ready===true;const box=$('#checks');box.replaceChildren();for(const c of d.checks??[]){box.append(text('div',`${c.ok?'✓':'!'} ${c.name}: ${c.message??''}`,'check '+(c.ok?'pass':'error')))}if(!d.checks?.length)box.append(text('p',ready?'Sẵn sàng':'Chưa đủ điều kiện chạy',ready?'pass':'error'))}catch(e){if(path!==preflightRequestPath())return;$('#checks').replaceChildren(text('p','Không kết nối được backend: '+e.message,'error'))}}

async function browserStatus(){if(usesExtension)return;try{const s=await api('/api/browser/status');if(usesExtension)return;$('#connectorStatus').textContent=s.ready?'Chrome riêng: Đã xác nhận đăng nhập.':s.connected?'Chrome riêng đã kết nối; cần đăng nhập/kiểm tra.':'Chrome riêng chưa kết nối. Bấm Mở Chrome riêng để bắt đầu.';}catch(e){if(!usesExtension)$('#connectorStatus').textContent=e.message;}}
async function browserControl(action,button){button.disabled=true;try{const s=await api('/api/browser/'+action,{method:'POST',body:'{}'});$('#connectorStatus').textContent=action==='start'?'Đã mở Chrome riêng. Bạn đăng nhập ChatGPT trong cửa sổ đó, rồi bấm Kiểm tra kết nối.':s.ready?'Đã xác nhận đăng nhập.':'Chưa xác nhận đăng nhập.';await preflight();}catch(e){$('#connectorStatus').textContent=e.message;}finally{button.disabled=false;}}
$('#browserStart').onclick=()=>browserControl('start',$('#browserStart'));
$('#browserProbe').onclick=()=>browserControl('probe',$('#browserProbe'));
$('#refresh').onclick=()=>Promise.all([preflight(),browserStatus()]);

function openOptionalWorkspace(jobId=null,view='editor'){
  const url=new URL(extensionScope?`/story-video/projects/${extensionScope}/production`:'/editor.html',location.origin);
  if(extensionScope){url.searchParams.set('workspace','editor');url.searchParams.set('scope',extensionScope);}
  if(jobId)url.searchParams.set('job',jobId);url.searchParams.set('view',view);
  window.open(url.href,'_blank','noopener');
}
window.openOptionalWorkspace=openOptionalWorkspace;

const socialPlatforms=[['youtube','YouTube'],['facebook','Facebook'],['tiktok','TikTok']];
function socialCopyText(platform,value){
  if(platform==='youtube')return [['Tiêu đề',value.title],['Mô tả',value.description],['Thẻ',(value.tags||[]).join(', ')]];
  return [['Caption',[value.caption,(value.hashtags||[]).join(' ')].filter(Boolean).join(platform==='facebook'?'\n\n':' ')]];
}
function copyButton(value){const b=text('button','Sao chép','secondary social-copy');b.type='button';b.onclick=async()=>{try{await navigator.clipboard.writeText(value);b.textContent='Đã chép';setTimeout(()=>b.textContent='Sao chép',1500);}catch{b.textContent='Không chép được';}};return b;}
function socialPanel(j){
  const panel=text('section','','social-panel');panel.dataset.job=j.id;
  const render=data=>{
    panel.replaceChildren(text('h4','Tiêu đề & caption để đăng'));
    if(data.state==='ready'){
      for(const [key,label] of socialPlatforms){const value=data[key];if(!value)continue;const box=text('div','','social-platform');box.append(text('strong',label));
        for(const [name,content] of socialCopyText(key,value)){if(!content)continue;const row=text('div','','social-field');row.append(text('span',name,'muted'),text('p',content),copyButton(content));box.append(row);}
        panel.append(box);}
      const again=text('button','Viết lại','secondary');again.type='button';again.onclick=()=>write();panel.append(again);
    } else if(data.state==='running'){panel.append(text('p','Đang viết tiêu đề và caption…','muted'));setTimeout(load,5000);}
    else{if(data.state==='error')panel.append(text('p','Chưa viết được: '+(data.error||'lỗi không rõ'),'error'));const go=text('button',data.state==='error'?'Viết lại':'Viết tiêu đề & caption','secondary');go.type='button';go.onclick=()=>write();panel.append(go);}
  };
  const load=async()=>{if(panel.dataset.loaded&&!panel.isConnected)return;panel.dataset.loaded='1';try{render(await api('/api/jobs/'+encodeURIComponent(j.id)+'/social'));}catch(error){render({state:'error',error:error.message});}};
  const write=async()=>{try{render(await api('/api/jobs/'+encodeURIComponent(j.id)+'/social',{method:'POST'}));}catch(error){render({state:'error',error:error.message});}};
  panel.append(text('p','Đang tải…','muted'));load();
  return panel;
}

$('#globalRefresh').onclick=()=>Promise.all([preflight(),browserStatus()]);
Promise.all([preflight(),browserStatus()]);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)preflight();});
</script><script src="/studio-create.js?v=20261116-trucly"></script><script src="/story-workspace.js?v=20261116-tabs1"></script><script src="/studio-details.js?v=20261114-story"></script><script src="/content-studio.js?v=20261116-rerender1"></script><script src="/video-folder.js?v=20261112-1"></script></body></html>
