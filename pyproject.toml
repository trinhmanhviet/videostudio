[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videostudio-local"
version = "0.1.0"
description = "Fail-closed durable local video orchestration"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1", "Pillow>=10,<13"]

[tool.setuptools.packages.find]
include = ["videostudio*"]
